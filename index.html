<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>我的優惠券庫</title>
    <style>
      :root {
        --theme: #06c755;
        --bg: #f4f6f8;
        --text: #17202a;
        --muted: #687481;
        --line: #dfe4ea;
        --danger: #a53b2a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
        font-size: 30px;
      }
      header {
        background: var(--theme);
        color: white;
        padding: 30px 22px 32px;
      }
      h1 {
        margin: 0;
        font-size: 38px;
        line-height: 1.2;
      }
      .sub {
        margin-top: 10px;
        color: rgba(255, 255, 255, .9);
        font-size: 27px;
      }
      main {
        width: 100%;
        max-width: 430px;
        margin: 0 auto;
        padding: 16px 14px 34px;
      }
      .tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
        margin-bottom: 14px;
      }
      button {
        appearance: none;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        color: var(--text);
        padding: 18px 8px;
        font: inherit;
        font-size: 27px;
        font-weight: 700;
      }
      button.active {
        border-color: var(--theme);
        color: var(--theme);
      }
      .notice {
        position: sticky;
        top: 0;
        z-index: 3;
        display: none;
        margin-bottom: 10px;
        padding: 18px 16px;
        border-radius: 8px;
        background: #17202a;
        color: white;
        font-size: 27px;
      }
      .card {
        margin-bottom: 16px;
        padding: 20px 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
      }
      .top {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: flex-start;
      }
      .type {
        color: var(--theme);
        font-size: 28px;
        font-weight: 800;
      }
      .status {
        padding: 7px 11px;
        border-radius: 999px;
        white-space: nowrap;
        font-size: 22px;
        font-weight: 800;
      }
      .status.ok { color: #0b7d45; background: #e8f7ef; }
      .status.used { color: #5f6670; background: #edf0f2; }
      .status.expired { color: var(--danger); background: #fff0ec; }
      .offer {
        margin-top: 10px;
        font-size: 35px;
        font-weight: 850;
      }
      .code {
        margin: 18px 0;
        padding: 18px 10px;
        border: 2px dashed var(--theme);
        border-radius: 8px;
        text-align: center;
        font-size: 41px;
        font-weight: 900;
        letter-spacing: 0;
      }
      .meta,
      .terms {
        color: var(--muted);
        font-size: 30px;
        line-height: 1.55;
        white-space: pre-line;
      }
      .redeem {
        width: 100%;
        margin-top: 18px;
        padding: 22px 12px;
        border-color: var(--theme);
        background: var(--theme);
        color: white;
        font-size: 31px;
      }
      .redeem:disabled { opacity: .55; }
      .empty {
        padding: 48px 12px;
        text-align: center;
        color: var(--muted);
        font-size: 30px;
      }
      .invite {
        padding: 26px 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
      }
      .invite h2 {
        margin: 0 0 12px;
        color: var(--theme);
        font-size: 36px;
      }
      .invite p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 30px;
        line-height: 1.55;
      }
      .invite-code {
        margin: 18px 0;
        padding: 18px 10px;
        border: 2px dashed var(--theme);
        border-radius: 8px;
        text-align: center;
        font-size: 38px;
        font-weight: 900;
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 18px;
        background: rgba(17, 24, 39, .55);
      }
      .modal {
        width: 100%;
        max-width: 400px;
        padding: 24px;
        border-radius: 8px;
        background: white;
        box-shadow: 0 18px 50px rgba(0, 0, 0, .24);
      }
      .modal h2 {
        margin: 0 0 12px;
        font-size: 34px;
      }
      .modal p {
        margin: 0;
        color: var(--muted);
        line-height: 1.45;
        font-size: 28px;
      }
      .modal-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 24px;
      }
      .modal-confirm {
        border-color: var(--theme);
        background: var(--theme);
        color: white;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">我的優惠券庫</h1>
      <div class="sub">查看可使用、已核銷與已過期優惠券</div>
    </header>
    <main>
      <div id="notice" class="notice"></div>
      <div class="tabs">
        <button class="active" data-filter="可使用">可使用</button>
        <button data-filter="已核銷">已核銷</button>
        <button data-filter="已過期">已過期</button>
      </div>
      <section id="list"></section>
    </main>
    <div id="modalBackdrop" class="modal-backdrop">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <h2 id="modalTitle">確認核銷</h2>
        <p id="modalText"></p>
        <div class="modal-actions">
          <button id="modalCancel">取消</button>
          <button id="modalConfirm" class="modal-confirm">確認核銷</button>
        </div>
      </div>
    </div>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
      const state = {
        apiUrl: '',
        botId: '',
        liffId: '',
        userId: '',
        coupons: [],
        filter: '可使用',
        pendingRedeem: null,
        claim: null,
        shareCode: ''
      };
      const list = document.getElementById('list');
      const title = document.getElementById('title');
      const notice = document.getElementById('notice');
      const modalBackdrop = document.getElementById('modalBackdrop');
      const modalText = document.getElementById('modalText');
      const modalCancel = document.getElementById('modalCancel');
      const modalConfirm = document.getElementById('modalConfirm');
      const tabButtons = Array.from(document.querySelectorAll('button[data-filter]'));
      const statusClass = { '可使用': 'ok', '已核銷': 'used', '已過期': 'expired' };

      bootstrap();

      async function bootstrap() {
        const params = mergedParams();
        state.apiUrl = params.get('apiUrl') || '';
        state.botId = params.get('botId') || params.get('bot') || '';
        state.liffId = params.get('liffId') || '';
        state.userId = params.get('userId') || params.get('uid') || '';
        state.claim = params.get('view') === 'claim'
          ? {
              src: params.get('src') || 'DEFAULT',
              stage: params.get('stage') || 'entry_review',
              order: params.get('order') || 1,
              type: params.get('type') || ''
            }
          : null;
        state.shareCode = params.get('shareCode') || '';

        if (!state.userId) await resolveLiffUser();
        if (!state.apiUrl || !state.botId) {
          showNotice('優惠券庫尚未完成設定');
          render();
          return;
        }
        if (!state.userId) {
          showNotice('請從 LINE 官方帳號按鈕開啟優惠券庫');
          render();
          return;
        }
        if (params.get('view') === 'invite' && state.shareCode) {
          loadInvite();
          return;
        }
        if (state.claim) {
          claimCoupon();
          return;
        }
        loadWallet();
      }

      async function resolveLiffUser() {
        if (!window.liff || !state.liffId) return;
        try {
          await liff.init({ liffId: state.liffId });
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }
          const profile = await liff.getProfile();
          state.userId = profile.userId || '';
        } catch (error) {
          showNotice('無法讀取 LINE 身分，請從 LINE 內重新開啟');
        }
      }

      function loadWallet() {
        callApi('wallet', {}, result => {
          applyPayload(result);
          render();
        });
      }

      function claimCoupon() {
        showNotice('優惠券加入中...');
        callApi('claim', state.claim, result => {
          applyPayload(result);
          showNotice(result.message || '優惠券已加入你的券庫');
          render('可使用');
        });
      }

      function loadInvite() {
        callApi('shareView', { shareCode: state.shareCode }, result => {
          applyPayload(result);
          renderInvite(result);
        });
      }

      function renderInvite(result) {
        tabButtons.forEach(button => button.classList.remove('active'));
        list.innerHTML = `
          <section class="invite">
            <h2>好友邀請禮</h2>
            <p>你收到一份好友分享優惠。點擊下方按鈕後，優惠券會加入你的券庫。</p>
            <div class="invite-code">${escapeHtml(result.shareCode || state.shareCode)}</div>
            <button class="redeem" id="claimShareCoupon">領取好友邀請券</button>
          </section>
        `;
        document.getElementById('claimShareCoupon').addEventListener('click', claimShareCoupon);
      }

      function claimShareCoupon() {
        showNotice('好友邀請券加入中...');
        callApi('shareClaim', { shareCode: state.shareCode }, result => {
          applyPayload(result);
          showNotice(result.message || '好友邀請券已加入');
          render('可使用');
        });
      }

      function redeemCoupon(code, button) {
        state.pendingRedeem = { code, button };
        modalText.textContent = '請確認由店員操作。確定要核銷優惠券 ' + code + ' 嗎？';
        modalBackdrop.style.display = 'flex';
      }

      function confirmRedeem() {
        if (!state.pendingRedeem) return;
        const code = state.pendingRedeem.code;
        const button = state.pendingRedeem.button;
        state.pendingRedeem = null;
        modalBackdrop.style.display = 'none';
        button.disabled = true;
        button.textContent = '核銷中...';
        callApi('redeem', { code }, result => {
          applyPayload(result);
          showNotice(result.message || '已更新');
          render(state.filter);
        }, () => {
          button.disabled = false;
          button.textContent = '店員核銷此券';
        });
      }

      function callApi(api, extraParams, onSuccess, onFailure) {
        const callback = '__couponWalletCallback_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
        const script = document.createElement('script');
        const params = new URLSearchParams({
          api,
          callback,
          botId: state.botId,
          userId: state.userId
        });
        Object.entries(extraParams || {}).forEach(([key, value]) => {
          if (value !== undefined && value !== null && value !== '') params.set(key, value);
        });
        window[callback] = result => {
          delete window[callback];
          script.remove();
          if (!result || result.ok === false) {
            showNotice(result && result.message ? result.message : '操作失敗，請稍後再試');
            if (onFailure) onFailure(result);
            return;
          }
          onSuccess(result);
        };
        script.onerror = () => {
          delete window[callback];
          script.remove();
          showNotice('連線失敗，請稍後再試');
          if (onFailure) onFailure();
        };
        script.src = state.apiUrl + (state.apiUrl.includes('?') ? '&' : '?') + params.toString();
        document.body.appendChild(script);
      }

      function applyPayload(result) {
        if (result.themeColor) document.documentElement.style.setProperty('--theme', result.themeColor);
        if (result.brandName) title.textContent = result.brandName + '｜我的優惠券庫';
        state.coupons = result.coupons || [];
      }

      function render(filter) {
        if (filter) state.filter = filter;
        tabButtons.forEach(button => button.classList.toggle('active', button.dataset.filter === state.filter));
        const items = state.coupons.filter(coupon => coupon.status === state.filter);
        if (!items.length) {
          list.innerHTML = '<div class="empty">目前沒有' + escapeHtml(state.filter) + '的優惠券</div>';
          return;
        }
        list.innerHTML = items.map(coupon => `
          <article class="card">
            <div class="top">
              <div class="type">${escapeHtml(coupon.type)}</div>
              <div class="status ${statusClass[coupon.status] || 'used'}">${escapeHtml(coupon.status)}</div>
            </div>
            <div class="offer">${escapeHtml(coupon.offer)}</div>
            <div class="code">${escapeHtml(coupon.code)}</div>
            <div class="meta">使用期限：${escapeHtml(coupon.expiresAt)}</div>
            ${coupon.redeemedAt ? `<div class="meta">核銷日期：${escapeHtml(coupon.redeemedAt)}</div>` : ''}
            <div class="terms">${escapeHtml(coupon.terms)}</div>
            ${coupon.status === '可使用' ? `<button class="redeem" data-code="${escapeAttr(coupon.code)}">店員核銷此券</button>` : ''}
          </article>
        `).join('');
        Array.from(document.querySelectorAll('button.redeem')).forEach(button => {
          button.addEventListener('click', () => redeemCoupon(button.dataset.code, button));
        });
      }

      function mergedParams() {
        const params = new URLSearchParams(window.location.search);
        const liffState = params.get('liff.state');
        if (liffState) {
          const stateParams = new URLSearchParams(liffState.replace(/^\?/, ''));
          stateParams.forEach((value, key) => params.set(key, value));
        }
        return params;
      }

      function showNotice(message) {
        notice.textContent = message;
        notice.style.display = 'block';
        setTimeout(() => { notice.style.display = 'none'; }, 3500);
      }

      function escapeHtml(value) {
        return String(value || '').replace(/[&<>"']/g, char => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[char]));
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/"/g, '&quot;');
      }

      tabButtons.forEach(button => {
        button.addEventListener('click', () => render(button.dataset.filter));
      });
      modalCancel.addEventListener('click', () => {
        modalBackdrop.style.display = 'none';
        state.pendingRedeem = null;
      });
      modalConfirm.addEventListener('click', confirmRedeem);
      modalBackdrop.addEventListener('click', event => {
        if (event.target === modalBackdrop) {
          modalBackdrop.style.display = 'none';
          state.pendingRedeem = null;
        }
      });
    </script>
  </body>
</html>
